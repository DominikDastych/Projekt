<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVault</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HLAVIČKA SE SEARCHBAREM -->
<header>
    <h1>Cine<span>Vault</span></h1>

    <div class="search-wrap">
        <input type="text" id="search-input" placeholder="Hledat filmy nebo seriály..." autocomplete="off">
        <button id="search-button">Hledat</button>
    </div>
</header>

<!-- HLAVNÍ OBSAH STRÁNKY -->
<main>

    <!-- ÚVODNÍ SEKCE -->
    <section class="hero">
        <div class="hero-content">
            <h2>CineVault</h2>
            <p>
                Prozkoumávej svět filmů a seriálů. Zobraz si hodnocení,
                popis i detailní informace o každém titulu.
            </p>
        </div>
    </section>

    <!-- NADPIS SEKCE -->
    <h2 class="section-title">Výsledky vyhledávání</h2>

    <!-- SEM FRONTEND-MAIN.JS VKLÁDÁ FILMOVÉ KARTY -->
    <div id="movie-container">
        <p class="hint">Načítám filmy...</p>
    </div>

</main>

<!-- DETAIL FILMU -->
<div id="modal" class="modal">
    <div class="modal-box">

        <!-- ZAVŘENÍ DETAILU -->
        <span id="close-modal">&times;</span>

        <!-- PLAKÁT FILMU -->
        <img id="modal-img" src="" alt="Movie Poster">

        <!-- INFORMACE O FILMU -->
        <div class="modal-text">
            <h2 id="modal-title"></h2>
            <p id="modal-rating"></p>
            <p id="modal-description"></p>
        </div>

    </div>
</div>

<script src="frontend-main.js"></script>

</body>
</html>
